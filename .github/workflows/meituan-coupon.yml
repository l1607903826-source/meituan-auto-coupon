name: Meituan daily coupon

on:
  workflow_dispatch:
  schedule:
    # UTC 02:17 = Beijing 10:17. GitHub schedules may be delayed.
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: meituan-daily-coupon
  cancel-in-progress: false

jobs:
  claim:
    # Disabled by default. Enable this variable only after a manual success.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_CLAIM == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run offline unit tests
        run: python3 -m unittest discover -s . -v

      - name: Require authorization secret
        env:
          MEITUAN_TOKEN: ${{ secrets.MEITUAN_TOKEN }}
        run: |
          if [ -z "${MEITUAN_TOKEN//[[:space:]]/}" ]; then
            echo "::error::MEITUAN_TOKEN is missing or blank. Add it as an Actions secret."
            exit 2
          fi

      - name: Claim once and write a minimal summary
        env:
          MEITUAN_TOKEN: ${{ secrets.MEITUAN_TOKEN }}
        run: python3 coupon.py
